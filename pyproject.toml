[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k4-day08-rag-pipeline"
version = "0.1.0"
description = "Day 8 lab for building and evaluating a RAG pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "chromadb>=0.5.0,<2",
    "google-genai>=1.0.0,<3",
    "langchain-text-splitters>=1.1.2,<2",
    "markitdown[pdf]>=0.1.0,<0.2",
    "numpy>=1.26.0,<3",
    "python-dotenv>=1.0.0,<2",
    "rank-bm25>=0.2.2,<0.3",
    "requests>=2.31.0,<3",
    "streamlit>=1.35.0,<2",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.46.0,<2",
    "pytest>=7.0.0",
]
anthropic = ["anthropic>=0.40.0,<2"]
openai = ["openai>=2.0.0,<3"]
pageindex = ["pageindex>=0.2.8"]
local-embeddings = ["sentence-transformers>=2.2.0,<7"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
